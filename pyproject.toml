[project]
name = "la-rp-peace"
version = "0.1.0"
description = "Hackathon project for team la(rp)-peace"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.3",
    "openai>=3.19.0",
    "openpyxl>=3.1.5",
    "pydantic-settings>=2.15.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "regex>=2026.9.10",
    "sqlalchemy>=2",
    "structlog>=25.1.0",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/la_rp_peace"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest>=8.3.0",
    "types-openpyxl>=3.1.5.20260827",
    "httpx2>=2.13.1",
    "types-regex>=2026.9.10.20260911",
]

# ---------------------------------------------------------------------------
# ruff -- rule set mirrors .agents/guidelines.md; keep the two in sync.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "SIM",  # flake8-simplify
    "S",    # flake8-bandit (security)
    "C4",   # flake8-comprehensions
    "PT",   # flake8-pytest-style
    "RET",  # flake8-return
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ICN",  # flake8-import-conventions
    "PERF", # perflint
    "C901", # McCabe complexity
    "RUF",  # Ruff-specific rules
    "D",    # pydocstyle (Google-style docstrings)
]
ignore = [
    "RUF001", # Ambiguous Cyrillic chars -- false positives in Russian-language strings
    "RUF002", # Ambiguous chars in docstrings -- intentional math/typography
    "RUF003", # Ambiguous chars in comments -- intentional math/typography
    "S324",   # sha1/md5 hashing -- used for cache keys, not security
]

[tool.ruff.lint.isort]
known-first-party = ["la_rp_peace"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest relies on bare assert
    "D",    # docstrings not required in tests
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

# ---------------------------------------------------------------------------
# mypy -- strict, zero errors required.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
# pymupdf ships py.typed but leaves its Document constructor and methods unannotated.
untyped_calls_exclude = ["pymupdf"]

# ---------------------------------------------------------------------------
# pytest -- discover the test suite under tests/.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not live'"
markers = ["live: calls the real OpenAI API; run with `pytest -m live`"]
