services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: larp
      POSTGRES_PASSWORD: larp
      POSTGRES_DB: larp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larp -d larp"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
